<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daxil ol – LMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
 
  <aside class="side">
    <div class="brand">Learn<span>Hub</span></div>
    <div>
      <h2>Dərsləriniz sizi gözləyir.</h2>
      <p>Kurslara baxın, tapşırıqları təhvil verin və irəliləyişinizi bir yerdən izləyin.</p>
    </div>
    <small>© 2026 LearnHub LMS</small>
  </aside>
 
  <main class="main">
    <section class="card">
      <h1>Daxil ol</h1>
      <p class="sub">Hesabınıza giriş edin.</p>
 
      <form action="#" method="post">
        <div class="field">
          <label for="email">E-poçt</label>
          <input type="email" id="email" name="email" placeholder="ad@numune.az" required autocomplete="email">
        </div>
 
        <div class="field">
          <label for="password">Şifrə</label>
          <input type="password" id="password" name="password" placeholder="Şifrənizi daxil edin" required autocomplete="current-password">
        </div>
 
        <div class="options">
          <label><input type="checkbox" name="remember"> Məni xatırla</label>
          <a href="#">Şifrəni unutmusan?</a>
        </div>
 
        <button type="submit" class="btn">Daxil ol</button>
      </form>
 
      <p class="switch">Hesabın yoxdur? <a href="register.html">Qeydiyyatdan keç</a></p>
    </section>
  </main>
 
</body>
</html>
